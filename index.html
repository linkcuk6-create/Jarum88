<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Saya</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    body {
      background: #f5f6fa;
      color: #222;
      min-height: 100vh;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      background: #ffffff;
      padding-bottom: 80px;
    }

    header {
      padding: 25px 20px 15px;
    }

    .welcome {
      font-size: 14px;
      color: #888;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 27px;
    }

    .profile {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      float: right;
      margin-top: -38px;
    }

    .banner {
      margin: 15px 20px;
      padding: 22px;
      border-radius: 18px;
      background: linear-gradient(135deg, #222, #555);
      color: white;
    }

    .banner h2 {
      font-size: 21px;
      margin-bottom: 8px;
    }

    .banner p {
      font-size: 13px;
      opacity: .8;
    }

    .section {
      padding: 10px 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .card {
      background: #f7f7f7;
      border-radius: 16px;
      padding: 20px;
      min-height: 120px;
      cursor: pointer;
      transition: .2s;
    }

    .card:active {
      transform: scale(.97);
    }

    .icon {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 15px;
      margin-bottom: 5px;
    }

    .card p {
      font-size: 11px;
      color: #888;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 70px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .nav-item {
      text-align: center;
      color: #999;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #222;
      font-weight: bold;
    }

    .nav-icon {
      font-size: 21px;
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <div class="welcome">Selamat datang 👋</div>
      <h1>Aplikasi Saya</h1>
      <div class="profile">👤</div>
    </header>

    <div class="banner">
      <h2>Semua dalam satu aplikasi</h2>
      <p>Pilih fitur yang ingin kamu gunakan.</p>
    </div>

    <div class="section">
      <div class="section-title">Menu Utama</div>

      <div class="features">

        <div class="card" onclick="alert('Fitur Beranda')">
          <div class="icon">🏠</div>
          <h3>Beranda</h3>
          <p>Lihat halaman utama</p>
        </div>

        <div class="card" onclick="alert('Fitur Data')">
          <div class="icon">📋</div>
          <h3>Data</h3>
          <p>Kelola data kamu</p>
        </div>

        <div class="card" onclick="alert('Fitur Pesan')">
          <div class="icon">💬</div>
          <h3>Pesan</h3>
          <p>Lihat pesan masuk</p>
        </div>

        <div class="card" onclick="alert('Fitur Pengaturan')">
          <div class="icon">⚙️</div>
          <h3>Pengaturan</h3>
          <p>Atur aplikasi</p>
        </div>

      </div>
    </div>

  </div>

  <div class="bottom-nav">

    <div class="nav-item active" onclick="alert('Beranda')">
      <span class="nav-icon">🏠</span>
      Beranda
    </div>

    <div class="nav-item" onclick="alert('Cari')">
      <span class="nav-icon">🔍</span>
      Cari
    </div>

    <div class="nav-item" onclick="alert('Notifikasi')">
      <span class="nav-icon">🔔</span>
      Notifikasi
    </div>

    <div class="nav-item" onclick="alert('Profil')">
      <span class="nav-icon">👤</span>
      Profil
    </div>

  </div>

</body>
</html>
